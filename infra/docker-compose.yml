services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: day7_rag
      POSTGRES_USER: day7
      POSTGRES_PASSWORD: day7_local_only
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - day7_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U day7 -d day7_rag"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  day7_pg_data:

